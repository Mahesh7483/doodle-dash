# Render's free plan puts the game to sleep after 15 minutes without visitors, and waking it
# takes 30-50 seconds. This pings the health check every 5 minutes so the game is always
# ready when someone opens the link. Free for public repositories.
#
# If a run fails, the game is down: check the service in the Render dashboard.
# To stop pinging, disable this workflow in the repository's Actions tab.
name: Keep the game awake

on:
  schedule:
    - cron: '3-58/5 * * * *' # every 5 minutes, off the busy :00 mark
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl --fail --silent --show-error --retry 3 --retry-delay 15 --max-time 90 https://doodle-dash-stv7.onrender.com/healthz
